<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中译英翻译系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: bold;
        }
        
        .input-group {
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            max-height: 300px;
            text-align: center;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        button {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .translate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .translate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .translate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .clear-btn {
            background: #f5f5f5;
            color: #333;
        }
        
        .clear-btn:hover {
            background: #e0e0e0;
        }
        
        .result-group {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .result-label {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .result-text {
            color: #333;
            font-size: 18px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 16px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .examples {
            margin-top: 30px;
            padding: 20px;
            background: #fff9e6;
            border-radius: 10px;
        }
        
        .examples h3 {
            color: #f39c12;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .example-item {
            padding: 10px;
            margin: 8px 0;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .example-item:hover {
            background: #ffe8cc;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>中译英翻译系统</h1>
        
        <div class="input-group">
            <label for="source-text">请输入中文文本:</label>
            <textarea id="source-text" placeholder="请输入要翻译的中文文本..."></textarea>
        </div>
        
        <div class="button-group">
            <button class="translate-btn" id="translate-btn" onclick="translateText()">翻译</button>
            <button class="clear-btn" onclick="clearText()">清空</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在翻译中，请稍候...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result-group" id="result-group" style="display: none;">
            <div class="result-label">翻译结果:</div>
            <div class="result-text" id="translation"></div>
        </div>
        
        <div class="footer">
            <p>基于Transformer模型的中译英翻译系统 | Powered by AI</p>
        </div>
    </div>
    
    <script>
        function translateText() {
            const sourceText = document.getElementById('source-text').value.trim();
            
            if (!sourceText) {
                showError('请输入要翻译的文本');
                return;
            }
            
            // 显示加载状态
            document.getElementById('loading').classList.add('show');
            document.getElementById('translate-btn').disabled = true;
            document.getElementById('source-text').disabled = true;
            document.getElementById('error').classList.remove('show');
            document.getElementById('result-group').style.display = 'none';
            
            // 发送翻译请求
            fetch('/translate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    text: sourceText
                })
            })
            .then(response => response.json())
            .then(data => {
                // 隐藏加载状态
                document.getElementById('loading').classList.remove('show');
                document.getElementById('translate-btn').disabled = false;
                document.getElementById('source-text').disabled = false;
                
                if (data.success) {
                    // 显示翻译结果
                    document.getElementById('translation').textContent = data.translation;
                    document.getElementById('result-group').style.display = 'block';
                } else {
                    showError(data.error || '翻译失败，请重试');
                }
            })
            .catch(error => {
                // 隐藏加载状态
                document.getElementById('loading').classList.remove('show');
                document.getElementById('translate-btn').disabled = false;
                document.getElementById('source-text').disabled = false;
                
                showError('网络错误: ' + error.message);
            });
        }
        
        function clearText() {
            document.getElementById('source-text').value = '';
            document.getElementById('result-group').style.display = 'none';
            document.getElementById('error').classList.remove('show');
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '错误: ' + message;
            errorDiv.classList.add('show');
        }
        
        function useExample(text) {
            document.getElementById('source-text').value = text;
            document.getElementById('error').classList.remove('show');
        }
        
        // 支持回车键翻译
        document.getElementById('source-text').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                translateText();
            }
        });
    </script>
</body>
</html>
